<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="capTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1E1B4B" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Squircle Badge -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
  
  <!-- Subtle border highlight -->
  <rect x="12" y="12" width="488" height="488" rx="108" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="6"/>

  <g filter="url(#dropShadow)">
    <!-- Skull Cap Neck / Headband -->
    <path d="M 148 232 V 285 C 148 350 196 392 256 392 C 316 392 364 350 364 285 V 232 Z" 
          fill="#E0E7FF"/>
    <path d="M 175 250 C 175 325 210 365 256 365 C 302 365 337 325 337 250" 
          fill="none" stroke="#C7D2FE" stroke-width="6"/>

    <!-- 3D Mortarboard Rim -->
    <polygon points="64,192 256,276 448,192 448,206 256,290 64,206" fill="#C7D2FE"/>

    <!-- Mortarboard Diamond Top -->
    <polygon points="256,108 448,192 256,276 64,192" fill="url(#capTop)"/>

    <!-- Center Gold Button -->
    <circle cx="256" cy="192" r="14" fill="url(#goldGrad)"/>

    <!-- Golden Tassel Cord -->
    <path d="M 256 192 C 345 200 405 235 412 280 L 412 328" 
          fill="none" stroke="url(#goldGrad)" stroke-width="9" stroke-linecap="round"/>
    
    <!-- Tassel Ring & Brush -->
    <rect x="404" y="322" width="16" height="7" rx="3" fill="#B45309"/>
    <path d="M 404 329 L 399 368 C 399 373 425 373 425 368 L 420 329 Z" fill="url(#goldGrad)"/>
    
    <!-- Career Star / Placement Accent on the Cap -->
    <path d="M 256 325 L 260 335 L 271 336 L 263 343 L 265 354 L 256 348 L 247 354 L 249 343 L 241 336 L 252 335 Z" fill="url(#goldGrad)"/>
  </g>
</svg>
